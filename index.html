
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineWave | Stream Your World</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="logo">CineWave</div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#shows">Shows</a>
            <a href="#">Sign In</a>
        </div>
    </nav>


    <!-- Featured Banner -->
    <section class="banner">

        <div class="banner-content">
            <h1 class="title">Beyond The Stars</h1>

            <p>
                Explore a mysterious universe where every journey
                reveals a new adventure.
            </p>

            <button class="play-btn">▶ Play Now</button>
        </div>

    </section>


    <!-- Show Cards Section -->
    <section class="shows" id="shows">

        <h2>Trending Shows</h2>

        <div class="card-container">

            <div class="card" data-new="true">
                <div class="poster poster-one"></div>
                <h3>Dark Horizon</h3>
                <p>Sci-Fi • 2026</p>
            </div>

            <div class="card">
                <div class="poster poster-two"></div>
                <h3>Lost Kingdom</h3>
                <p>Adventure • 2025</p>
            </div>

            <div class="card" data-new="true">
                <div class="poster poster-three"></div>
                <h3>Midnight Chase</h3>
                <p>Thriller • 2026</p>
            </div>

            <div class="card">
                <div class="poster poster-four"></div>
                <h3>Ocean Mystery</h3>
                <p>Drama • 2025</p>
            </div>

        </div>

    </section>


    <!-- Footer -->
    <footer>
        <p>© 2026 CineWave. All Rights Reserved.</p>
    </footer>

</body>
</html>
